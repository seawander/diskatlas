name: Deploy to GitHub Pages

# CI-gated deploy of the static site to GitHub Pages. This is the live deploy
# path (repo Pages source = "GitHub Actions", build_type: workflow). Every push
# to master re-runs the guards in `verify` and only publishes if they pass.
# `workflow_dispatch` is kept so a deploy can also be triggered manually.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Re-run the same guards before publishing, so a bad commit never deploys.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 backend-data/validate.py
      - run: python3 backend-infra/check_data_sync.py
      - run: python3 backend-infra/check_images.py

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
