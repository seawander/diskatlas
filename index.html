<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>diskatlas: resolved circumstellar disks & imaged companions</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="frontend/style.css">
<link rel="icon" type="image/svg+xml" href="frontend/logo.svg">
<link rel="icon" type="image/png" sizes="64x64" href="frontend/favicon.png">
<link rel="apple-touch-icon" href="frontend/apple-touch-icon.png">
</head>
<body>
<header id="topbar">
  <img id="logo" src="frontend/logo.svg" alt="" width="30" height="30" style="align-self:center;flex:none">
  <div id="title">
    <span class="t1"><code class="brand">diskatlas</code>: <span data-i18n="title">resolved circumstellar disks &amp; imaged companions</span></span>
    <span class="t2" id="statsline">loading…</span>
  </div>
  <div id="viewtabs"></div>
  <input id="search" type="search" data-i18n-ph="search_ph" placeholder="Search star… (e.g. HL Tau)" autocomplete="off">
  <label id="langicon" for="lang" title="language / 语言 / langue / idioma" aria-label="Change language"><svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="currentColor"><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/></svg></label>
  <select id="lang" title="language / 语言 / langue / idioma"></select>
  <div id="filters"></div>
  <div id="facets"></div>
  <!-- search dropdown lives INSIDE the fixed header so phone keyboards /
       focus zoom can never separate it from the search box -->
  <div id="searchlist" hidden></div>
</header>

<main>
  <canvas id="sky"></canvas>
  <div id="matrix" hidden></div>
  <div id="tonight" hidden></div>
  <div id="legend"></div>
  <a id="ghlink" href="https://github.com/seawander/diskatlas" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.5 7.5 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg><span class="ghtext">GitHub · <span data-i18n="gh_contrib">contributions welcome</span></span></a>
</main>
<div id="tooltip" hidden></div>

<aside id="detail" hidden>
  <button id="closebtn" title="close (Esc)">×</button>
  <h2 id="d_name"></h2>
  <div id="d_sub"></div>
  <div id="d_imgwrap">
    <button class="nav" id="d_prev" title="previous (←)">‹</button>
    <div id="d_imgbox"></div>
    <button class="nav" id="d_next" title="next (→)">›</button>
  </div>
  <div id="d_slider"></div>
  <div id="d_caption"></div>
  <div id="d_planets"></div>
  <div id="d_notes"></div>
</aside>

<script src="frontend/data.js"></script>
<script src="frontend/constellations.js"></script>
<script src="frontend/i18n.js"></script>
<script src="frontend/app.js"></script>
</body>
</html>
